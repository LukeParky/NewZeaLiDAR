# YML file for setting up Python environment
name: lidar
channels:
  - conda-forge
  - defaults
dependencies:
  - python
  - pip
  - python-dotenv
  - pytest
  - lxml
  - pandas
  - geopandas
  - rasterio
  - geojson
  - python-pdal
  - pdal
  - gdal
  - pygeos
  - shapely
  - psycopg2
  - sqlalchemy
  - geoalchemy2
  - scrapy==2.11.1 # Newer versions are causing bugs where data is not downloaded
  - dask
  - bokeh!=3.0.*,>=2.4.2  # for Dask dashboard
  - laspy
  - pip:
    - laszip  # for vertical datum transference
    - geofabrics
    - geovoronoi
    - geoapis
prefix:
